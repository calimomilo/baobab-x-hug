name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create SSH key and push to bare repo
        env:
          SSH_PRIVATE_KEY: ${{secrets.SSH_PRIVATE_KEY}}
          SSH_KNOWN_HOSTS: ${{secrets.SSH_KNOWN_HOSTS}}
          SSH_USER: ${{vars.SSH_USER}}
          SSH_HOST: ${{vars.SSH_HOST}}
          REMOTE_PATH: ${{vars.REMOTE_PATH}}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          git remote add production "$SSH_USER@$SSH_HOST:$REMOTE_PATH"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_rsa $SSH_USER@$SSH_HOST" git push production main --force
